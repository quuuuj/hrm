server:
  port: ${SERVER_PORT:8888}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    master:
      jdbc-url: ${DB_MASTER_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource
    flowable:
      jdbc-url: ${DB_FLOWABLE_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource
    kb:
      jdbc-url: ${KB_DB_URL:jdbc:postgresql://localhost:5432/hrm_kb}
      username: ${KB_DB_USERNAME:postgres}
      password: ${KB_DB_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver
      type: com.zaxxer.hikari.HikariDataSource

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:30MB}

  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    database: ${REDIS_DATABASE:0}
    lettuce:
      pool:
        max-idle: 16
        max-active: 32
        min-idle: 8

  main:
    allow-bean-definition-overriding: true

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
      embedding:
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}

flowable:
  database-schema-update: true
  dmn:
    enabled: false
  form:
    enabled: false
  app:
    enabled: false
  content:
    enabled: false

mybatis-plus:
  configuration:
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  type-enums-package: com.qiujie.*.enums
  mapper-locations: classpath:mapper/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}

staff:
  default-password: ${STAFF_DEFAULT_PASSWORD:123}

chat:
  enabled: ${CHAT_ENABLED:false}
  timeout-seconds: ${CHAT_TIMEOUT_SECONDS:15}
  provider:
    base-url: ${LLM_PROVIDER_BASE_URL:}
    api-key: ${LLM_PROVIDER_API_KEY:}
    model: ${LLM_PROVIDER_MODEL:}

# MinIO 对象存储
storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:hrm}


# 知识库模块配置
knowledge:
  enabled: ${KNOWLEDGE_ENABLED:false}
  chunk:
    max-size: ${KNOWLEDGE_CHUNK_MAX_SIZE:1000}
    overlap: ${KNOWLEDGE_CHUNK_OVERLAP:100}
  embedding:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}

