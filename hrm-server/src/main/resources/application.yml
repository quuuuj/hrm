# 周末补班（调休上班）日：国家因法定节假日调休安排而把周六/周日设为工作日的日期（2026 年安排）
makeup-workdays:
  - 2026-01-04
  - 2026-02-14
  - 2026-02-28
  - 2026-04-26
  - 2026-05-09
  - 2026-09-20
  - 2026-10-10

# 本地开发调试日志级别
logging:
  level:
    com.qiujie: debug
    org.springframework.ai.openai: TRACE
    org.springframework.web.client.RestClient: DEBUG
